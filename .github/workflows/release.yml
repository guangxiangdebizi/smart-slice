# Build + test, then publish to PyPI using Trusted Publishing (OIDC).
#
# No API token is stored in this repository, in GitHub secrets, or on any
# developer machine: the workflow proves its identity to PyPI with a short-lived
# OIDC token minted by GitHub Actions. PyPI must be configured once to trust this
# workflow (see the "Trusted publisher" block in the project's PyPI settings):
#
#   PyPI project name : smart-slice
#   Owner             : guangxiangdebizi
#   Repository        : smart-slice
#   Workflow filename : release.yml
#   Environment name  : pypi
#
# Triggers:
#   - push of a v* tag            -> automatic release build + publish
#   - GitHub Release published    -> automatic release build + publish
#   - workflow_dispatch           -> manual run (used for the first publish of an
#                                    already-built version, or for a dry check)
#
# Every trigger runs the full offline test suite before anything is uploaded; a
# failing suite blocks publication.

name: release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the upload without publishing to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build distributions and run the offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check distribution metadata
        run: python -m twine check dist/*

      # The full suite exercises every format parser, so it runs with all format
      # extras installed plus pytest/ruff. The `accel` extra is deliberately NOT
      # installed: it pulls ziglang (~400 MB) and the C extension is only an
      # optional optimisation - tests/test_c_speedup.py skips its C-specific cases
      # and still asserts the pure-Python scan never changes slicing output.
      - name: Run the full test suite (all format extras)
        run: |
          python -m pip install --disable-pip-version-check \
            -e ".[all]" pytest ruff
          python -m pytest tests -q
          python -m ruff check smart_slice tests

      # Separate regression guard for the published wheel, checked against the
      # actual built artefact in a clean venv that has ONLY the core dependency:
      # the package must import, core slicing must work, formats whose parser is
      # absent must degrade to "unsupported" (400) instead of raising at import
      # time, and the pure-stdlib handlers must still work. This is the contract
      # the README promises - it must be checked in a bare venv, never in the
      # full-extras environment above.
      - name: Verify the bare-install contract on the built wheel
        run: |
          python -m venv /tmp/barecheck
          /tmp/barecheck/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/barecheck/bin/python - <<'PY'
          import smart_slice as s
          assert s.__version__, "version missing"
          assert s.slice_text("# T\n\nbody", limit=100), "core slicing broken"
          # a parser deliberately NOT installed must degrade, not crash
          try:
              s.slice_bytes(b"%PDF-1.4 x", "a.pdf")
          except s.SliceError as e:
              assert e.code == 400, f"expected 400 for a missing parser, got {e.code}"
          except Exception as e:
              raise SystemExit(f"bare install raised {type(e).__name__}: {e}")
          # pure-stdlib handlers must work with no extras installed at all
          assert s.slice_bytes(b'<svg xmlns="x"><text>t</text></svg>', "n.svg"), "svg broken"
          assert s.slice_bytes(b"1\n00:00:01,000 --> 00:00:02,000\ncue\n", "s.srt"), "srt broken"
          print("bare-install contract OK:", s.__version__,
                len(s.HANDLER_EXTENSIONS), "handlers")
          PY

      - name: Upload distributions as workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: python -m pip install --upgrade pip twine

      - name: Check distributions before upload
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Dry run (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run selected: distributions validated, nothing uploaded."
          ls -l dist/