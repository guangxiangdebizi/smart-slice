# Build + test, then publish to PyPI using Trusted Publishing (OIDC).
#
# No API token is stored in this repository, in GitHub secrets, or on any
# developer machine: the workflow proves its identity to PyPI with a short-lived
# OIDC token minted by GitHub Actions. PyPI must be configured once to trust this
# workflow (see the "Trusted publisher" block in the project's PyPI settings):
#
#   PyPI project name : smart-slice
#   Owner             : guangxiangdebizi
#   Repository        : smart-slice
#   Workflow filename : release.yml
#   Environment name  : pypi
#
# Triggers:
#   - push of a v* tag            -> automatic release build + publish
#   - GitHub Release published    -> automatic release build + publish
#   - workflow_dispatch           -> manual run (used for the first publish of an
#                                    already-built version, or for a dry check)
#
# Every trigger runs the full offline test suite before anything is uploaded; a
# failing suite blocks publication.

name: release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the upload without publishing to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build distributions and run the offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --disable-pip-version-check dist/*.whl

      # Regression guard: the published wheel must be importable with only its
      # core dependency installed, and formats whose parser is missing must
      # degrade to "unsupported" instead of raising at import time.
      - name: Verify the bare-install contract
        run: |
          /tmp/wheelcheck/bin/python - <<'PY'
          import smart_slice as s
          assert s.__version__, "version missing"
          assert s.slice_text("# T\n\nbody", limit=100), "core slicing broken"
          try:
              s.slice_bytes(b"%PDF-1.4 x", "a.pdf")
          except s.SliceError as e:
              assert e.code == 400, f"expected 400 for a missing parser, got {e.code}"
          except Exception as e:
              raise SystemExit(f"bare install raised {type(e).__name__}: {e}")
          print("bare-install contract OK:", s.__version__,
                len(s.HANDLER_EXTENSIONS), "handlers")
          PY

      - name: Run the test suite from the installed wheel
        run: |
          /tmp/wheelcheck/bin/python -m pip install --disable-pip-version-check pytest
          /tmp/wheelcheck/bin/python -m pytest tests -q

      - name: Upload distributions as workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: python -m pip install --upgrade pip twine

      - name: Check distributions before upload
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Dry run (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run selected: distributions validated, nothing uploaded."
          ls -l dist/